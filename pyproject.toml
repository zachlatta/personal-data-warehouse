[project]
name = "personal_data_warehouse"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.22",
    "dagster-postgres>=0.28.22",
    "google-api-python-client>=2.169.0",
    "google-auth-oauthlib>=1.2.2",
    "markdownify>=1.2.2",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.10",
    "pypdf>=6.10.2",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "slack-sdk>=3.41.0",
    "neonize==0.4.3.post0",
    "qrcode>=8.2",
    "pillow-heif>=1.4.0",
    # curl_cffi impersonates a browser for the server-side claude.ai / chatgpt.com
    # / WHOOP pollers, which sit behind Cloudflare managed challenges.
    "curl-cffi>=0.13",
]

[project.scripts]
personal-data-warehouse-gmail-auth = "personal_data_warehouse.gmail_auth:main"
personal-data-warehouse-google-auth = "personal_data_warehouse.gmail_auth:main"
personal-data-warehouse-contacts-sync = "personal_data_warehouse.contacts_sync:main"
personal-data-warehouse-google-drive-source-sync = "personal_data_warehouse.google_drive_source_sync:main"
personal-data-warehouse-slack-sync = "personal_data_warehouse.slack_sync:main"
personal-data-warehouse-whoop-auth = "personal_data_warehouse.whoop_auth:main"
personal-data-warehouse-whoop-sync = "personal_data_warehouse.whoop_sync:main"
personal-data-warehouse-whoop-private-sync = "personal_data_warehouse.whoop_private_sync:main"
# Every device-side client (the uploaders, the mutation workers, the
# browser-session publishers, the run heartbeat) is native Go in the pdw CLI
# (`pdw ingest <source>`, `pdw mutations <provider>`, `pdw <service>
# publish-session`, `pdw heartbeat`); nothing in this package runs on a Mac.
# whatsapp-client stays a console script because it is a local pairing/debug
# tool, not a scheduled uploader (WhatsApp ingests in-process in the production
# Dagster deployment).
personal-data-warehouse-whatsapp-client = "personal_data_warehouse_whatsapp.cli:main"
personal-data-warehouse-agent-auth = "personal_data_warehouse.agent_runner:auth_main"

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "local_integration: tests that need local Docker or a real disposable Postgres",
    "subscription_agent: real subscription-backed agent canaries",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/personal_data_warehouse",
    "src/personal_data_warehouse_claude_desktop",
    "src/personal_data_warehouse_alice_voice_recordings",
    "src/personal_data_warehouse_whatsapp",
]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "personal_data_warehouse"
registry_modules = [
    "personal_data_warehouse.components.*",
]
