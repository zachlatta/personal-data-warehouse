name: mobile-update

# Publish the iOS app's JS over the air on every push to main that touches
# mobile/. The installed app checks for an update on launch, so Zach's phone
# picks it up without a reinstall. Native changes (a new package, an iOS
# config change) do not ship this way: they need `eas build --profile preview`
# and a reinstall from the build link.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-update.yml"

concurrency:
  group: mobile-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Publish OTA update to the preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel preview --auto --non-interactive
      # An OTA update only reaches an install whose native fingerprint matches.
      # When the fingerprint moved (new native package, iOS config), queue a
      # new preview build; its link is on expo.dev and Zach reinstalls once.
      - name: Queue a native build when the fingerprint changed
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          last=$(npx eas-cli build:list --platform ios --profile preview --status finished --limit 1 --json --non-interactive | python3 -c 'import json,sys; b=json.load(sys.stdin); print(b[0]["id"] if b else "")')
          if [ -z "$last" ]; then echo "no finished preview build yet; building"; npx eas-cli build --platform ios --profile preview --non-interactive --no-wait; exit 0; fi
          npx eas-cli fingerprint:compare --build-id "$last" --json --non-interactive > /tmp/fp.json
          python3 - <<'PY'
          import json,subprocess,sys
          d=json.load(open('/tmp/fp.json'))
          a=d['fingerprint1']['hash']; b=d['fingerprint2']['hash']
          print('project', a, 'last build', b)
          if a==b:
              print('native fingerprint unchanged; OTA update is enough'); sys.exit(0)
          print('native fingerprint changed; queueing a preview build')
          subprocess.check_call(['npx','eas-cli','build','--platform','ios','--profile','preview','--non-interactive','--no-wait'])
          PY
