name: mobile-update

# Publish the phone app's JS (Android and iOS) over the air on every push to
# main that touches mobile/. The installed app checks for an update on launch,
# so Zach's phone picks it up without a reinstall. Native changes (a new
# package, an Android or iOS config change) do not ship this way: they need
# `eas build --profile preview` and a reinstall from the build link.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-update.yml"

concurrency:
  group: mobile-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      # The review logic (which mutations are a Gmail batch, how a thread reads
      # as a row, how a day groups) is pure and has node tests. Nothing else in
      # CI runs them, and an OTA publish is the last place to find out.
      - run: npm test
      - name: Publish OTA update to the preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel preview --auto --non-interactive
      # An OTA update only reaches an install whose native fingerprint matches.
      # When a platform's fingerprint moved (new native package, iOS or Android
      # config), queue a new preview build for it; its link is on expo.dev and
      # Zach reinstalls once. Android is the phone he carries; iOS still builds.
      - name: Queue a native build when the fingerprint changed
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          for platform in android ios; do
            last=$(npx eas-cli build:list --platform "$platform" --profile preview --status finished --limit 1 --json --non-interactive | python3 -c 'import json,sys; b=json.load(sys.stdin); print(b[0]["id"] if b else "")')
            if [ -z "$last" ]; then echo "$platform: no finished preview build yet; building"; npx eas-cli build --platform "$platform" --profile preview --non-interactive --no-wait; continue; fi
            npx eas-cli fingerprint:compare --build-id "$last" --json --non-interactive > "/tmp/fp-$platform.json"
            PLATFORM="$platform" python3 - <<'PY'
          import json,os,subprocess,sys
          platform=os.environ['PLATFORM']
          d=json.load(open(f'/tmp/fp-{platform}.json'))
          a=d['fingerprint1']['hash']; b=d['fingerprint2']['hash']
          print(platform, 'project', a, 'last build', b)
          if a==b:
              print(platform, 'native fingerprint unchanged; OTA update is enough'); sys.exit(0)
          print(platform, 'native fingerprint changed; queueing a preview build')
          subprocess.check_call(['npx','eas-cli','build','--platform',platform,'--profile','preview','--non-interactive','--no-wait'])
          PY
          done
