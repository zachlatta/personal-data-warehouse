services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.4@sha256:bee0bdb887096229add91b6fdfcf95258c12eb9180e90dc86f3b4b25b86fc613
    restart: unless-stopped
    command:
      - --model-id
      - Qwen/Qwen3-Embedding-4B
      - --auto-truncate
      - --max-client-batch-size
      - "256"
      - --max-batch-tokens
      - "16384"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - "${EMBEDDINGS_CACHE_PATH:-/opt/pdw-embeddings/hf-cache}:/data"
    ports:
      - "${EMBEDDINGS_BIND_ADDRESS:?set EMBEDDINGS_BIND_ADDRESS to mew's tailnet IP}:${EMBEDDINGS_PORT:-8485}:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1/health
      start_period: 10m
      interval: 30s
      timeout: 5s
      retries: 5
